<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Soccer Bot C3</title>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; margin: 0; overflow: hidden; touch-action: none; text-align: center; }
    .header { background: #1976D2; color: white; padding: 15px; font-weight: bold; }
    .container { display: flex; justify-content: space-around; align-items: center; height: 65vh; }
    .btn { width: 110px; height: 110px; border-radius: 50%; border: 4px solid white; background: #ff9800; color: white; font-size: 35px; box-shadow: 0 6px #e68a00; }
    input[type=range] { width: 80%; }
  </style>
</head>

<body>
  <div class="header">ESP32-C3 SoccerBot TEST</div>
  <div class="container">
    <button class="btn" ontouchstart="send('kick')" ontouchend="send('kicker_stop')">⚽</button>
  </div>

  <script>
    function send(cmd) { fetch('/' + cmd); }
  </script>
</body>
</html>
