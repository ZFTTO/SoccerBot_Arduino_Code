<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>Soccer Bot C3</title>
        <style>
            body {
                font-family: sans-serif;
                background: #f0f2f5;
                margin: 0;
                overflow: hidden;
                touch-action: none;
                text-align: center;
            }
            .header {
                background: #1976d2;
                color: white;
                padding: 15px;
                font-weight: bold;
            }
            .container {
                display: flex;
                justify-content: space-around;
                align-items: center;
                height: 65vh;
            }
            .d-pad {
                display: grid;
                grid-template-columns: repeat(3, 75px);
                grid-gap: 10px;
            }
            .btn {
                width: 75px;
                height: 75px;
                border-radius: 15px;
                border: none;
                background: white;
                box-shadow: 0 4px #bbb;
                font-size: 18px;
                font-weight: bold;
            }
            .btn:active {
                box-shadow: 0 1px #bbb;
                transform: translateY(3px);
                background: #eee;
            }
            .btn-kick {
                width: 110px;
                height: 110px;
                border-radius: 50%;
                border: 4px solid white;
                background: #ff9800;
                color: white;
                font-size: 35px;
                box-shadow: 0 6px #e68a00;
            }
            .btn-kick:active {
                transform: translateY(5px);
                background: #ff9800;
                box-shadow: 0 1px #e68a00;
            }
            .speed-ctrl {
                padding: 20px;
                background: white;
                border-radius: 20px;
                margin: 10px 20px;
                font-weight: 800;
                font-size: 15px;
                color: #333;
            }
            input[type="range"] {
                width: 80%;
            }
        </style>
    </head>
    <body>
        <div class="header">⚽ ESP32-C3 SoccerBot</div>
        <div class="container">
            <div class="d-pad">
                <div></div>
                <button
                    class="btn"
                    onpointerdown="send('forward')"
                    onpointerup="send('stop')"
                    onpointercancel="send('stop')"
                    onpointerleave="send('stop')"
                >
                    ▲
                </button>
                <div></div>
                <button
                    class="btn"
                    onpointerdown="send('left')"
                    onpointerup="send('stop')"
                    onpointercancel="send('stop')"
                    onpointerleave="send('stop')"
                >
                    ◀
                </button>
                <button class="btn" style="background: #ffcdd2" onclick="send('stop')">■</button>
                <button
                    class="btn"
                    onpointerdown="send('right')"
                    onpointerup="send('stop')"
                    onpointercancel="send('stop')"
                    onpointerleave="send('stop')"
                >
                    ▶
                </button>
                <div></div>
                <button
                    class="btn"
                    onpointerdown="send('backward')"
                    onpointerup="send('stop')"
                    onpointercancel="send('stop')"
                    onpointerleave="send('stop')"
                >
                    ▼
                </button>
                <div></div>
            </div>
            <button
                class="btn-kick"
                onpointerdown="send('kick')"
                onpointerup="send('kicker_stop')"
                onpointerleave="send('kicker_stop')"
                onpointercancel="send('kicker_stop')"
            >
                ⚽
            </button>
        </div>
        <div class="speed-ctrl">
            Speed Control: <span id="speedVal">180</span><br />
            <input type="range" min="0" max="255" value="180" oninput="updateSpeed(this.value)" />
        </div>
        <script>
            function send(cmd) {
                fetch("/" + cmd);
            }
            function updateSpeed(val) {
                document.getElementById("speedVal").innerText = val;
                fetch("/setSpeed?val=" + val);
            }
        </script>
    </body>
</html>
